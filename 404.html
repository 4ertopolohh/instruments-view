<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      ;(function (location) {
        const pathSegmentsToKeep = 1
        const redirectPath =
          location.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          location.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash

        location.replace(`${location.protocol}//${location.hostname}${location.port ? ':' + location.port : ''}${redirectPath}`)
      })(window.location)
    </script>
  </head>
  <body></body>
</html>
